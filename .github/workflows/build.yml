name: Build Neon Client

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: neon-client-jar
          path: build/libs/*.jar

      - name: Controlla i mixin
        run: |
          mkdir -p /tmp/chk && cd /tmp/chk && unzip -q -o $GITHUB_WORKSPACE/build/libs/*.jar
          for c in dev/neonclient/mixin/*.class; do echo "== $c"; javap -v "$c" | grep -E "Utf8 .*(method_|class_|field_|net/minecraft|setup|render|turn|startAttack|continueAttack|startUseItem|setPosition|setRotation)" ; done
